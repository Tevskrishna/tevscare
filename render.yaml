# Free staging blueprint. Applying it requires the owner's Render login.
# Secrets are entered in the dashboard and are not stored here.
# Render sets PORT, usually 10000. The API listens on that port.
services:
  - type: web
    name: tevscare-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: Tevscare__SeedDemoData
        value: "false"
      - key: Tevscare__ExposeResetTokens
        value: "false"
      - key: Tevscare__ApplyMigrations
        value: "true"
      - key: Tevscare__TrustForwardedHeaders
        value: "true"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__Origins__0
        sync: false
